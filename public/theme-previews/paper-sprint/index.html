<!doctype html>
<html lang="en" class="wipe-in">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Anika Rao · Product Manager</title>
  <meta name="description" content="Product manager who began on the order desk at Pinewick Paper &amp; Print. Six years in B2B ordering, now finishing an MBA at Marrowgate School of Management and looking for a PM role." />
  <link rel="preload" href="fonts/syne-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <a class="skip" href="#main">Skip to content</a>

  <main id="main">

    <section class="hero" id="top" aria-label="Introduction" data-cursor="lens">
      <canvas class="plate" aria-hidden="true"></canvas>
      <img class="plate-poster" src="media/hero-classroom-poster.jpg" alt="" aria-hidden="true" />
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="lens-layer" aria-hidden="true"><div class="lens-notes"></div></div>
      <div class="lens-ring" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="lens-tag mono"></span></div>
      <div class="hero-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="hero-in"></div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="mq-track"></div></div>

    <section class="how" id="how" aria-labelledby="how-h"></section>
    <section class="cases" id="work" aria-labelledby="cases-h"></section>
    <section class="device" id="device" aria-labelledby="device-h"></section>
    <section class="number" id="number" aria-labelledby="number-h"></section>
    <section class="backlog" id="backlog" aria-labelledby="backlog-h"></section>
    <section class="index" id="index" aria-labelledby="index-h"></section>
    <section class="journey" id="journey" aria-labelledby="journey-h"></section>
    <section class="cv" id="cv" aria-label="Experience and education"></section>
    <section class="wins" id="wins" aria-labelledby="wins-h"></section>
    <section class="skills" id="skills" aria-labelledby="skills-h"></section>
    <section class="people" id="people" aria-label="Outside work and testimonials"></section>
    <section class="contact" id="contact" aria-labelledby="contact-h"></section>
  </main>

  <footer id="foot" class="foot"></footer>
  <div class="index-preview" aria-hidden="true"><div class="ip-in"></div></div>
  <div class="wipe" aria-hidden="true"><span class="wipe-label mono"></span></div>
  <div id="print-resume" class="print-only"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/Draggable.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/plate.js"></script>
  <script src="js/parts.js"></script>
