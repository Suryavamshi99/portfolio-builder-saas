<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dev Oberoi - Résumé view</title>
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { overflow: auto; height: auto; }
  body { background: #ffffff; padding-bottom: 0; }
  .btn-text { color: var(--blue); } .btn-text:hover { background: #fdeef8; }
  .btn-primary { background: var(--blue); color: #ffffff; } .btn-primary:hover { background: #a00875; }
  .btn-sm { height: 36px; padding: 0 16px; }
  .rv-top .btn .ms { font-size: 18px; }
  .rv { max-width: 820px; margin: 0 auto; padding: 24px 20px 48px; }
  .rv-top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: #ffffff; z-index: 5; }
  .rv-top .grow { flex: 1; }
  .rv-head { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px; align-items: center; margin: 16px 0 24px; }
  .rv-head img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
  .rv h1 { font: 400 32px/40px var(--f-head); margin: 0 0 4px; }
  .rv h2 { font: 500 13px/20px var(--f-head); text-transform: uppercase; letter-spacing: .8px; color: var(--mute); margin: 36px 0 12px; border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .rv p { margin: 0 0 10px; line-height: 22px; color: var(--ink-2); }
  .rv .lead { font: 400 17px/26px var(--f-head); color: var(--ink); }
  .rv .contact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .job { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 20px; margin-bottom: 18px; }
  .job .when { color: var(--mute); font-size: 13px; }
  .job b { font-weight: 500; color: var(--ink); }
  .job ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); line-height: 22px; }
  .proj { border-top: 1px solid var(--line-2); padding: 18px 0; }
  .proj h3 { font: 500 17px/24px var(--f-head); margin: 0 0 2px; }
  .proj .meta { font-size: 13px; color: var(--mute); margin-bottom: 8px; }
  .proj .res { color: var(--green); font-weight: 500; }
  .proj details { margin-top: 8px; }
  .proj summary { cursor: pointer; color: var(--blue); font: 500 14px var(--f-head); }
  .proj details ul { padding-left: 18px; color: var(--ink-2); line-height: 22px; }
  .skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .skills b { font-weight: 500; display: block; margin-bottom: 4px; }
  .skills ul { margin: 0; padding-left: 18px; color: var(--ink-2); line-height: 22px; }
  .rv-foot { font-size: 12px; color: var(--mute); border-top: 1px solid var(--line-2); margin-top: 40px; padding-top: 16px; }
  @media (max-width: 640px) { .rv-head { grid-template-columns: 1fr; gap: 12px; } .rv-head img { width: 96px; height: 96px; } .job { grid-template-columns: 1fr; } .skills { grid-template-columns: 1fr; } .rv h1 { font-size: 26px; line-height: 32px; } .rv-top .wordmark { display: none; } }
</style>
</head>
<body>
<header class="rv-top">
  <a class="brand" href="index.html#/" aria-label="Back to the map" style="display:flex;align-items:center;gap:8px;text-decoration:none"><img src="media/maps-icon.svg" alt="" width="18" height="26"><span class="wordmark" style="font:400 20px var(--f-head);color:var(--mute)">Atlas Desk</span></a>
  <span class="grow"></span>
  <a class="btn btn-text" href="index.html#/"><span class="ms">arrow_back</span>Map view</a>
  <a class="btn btn-primary" href="media/resume.pdf"><span class="ms">download</span>PDF</a>
</header>
<main class="rv" id="rv"><p>Loading…</p></main>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('content/portfolio.json').then(r => r.json()).then(P => {
  const p = P.person, c = P.contact;
  document.getElementById('rv').innerHTML = `
  <section class="rv-head"><img src="media/photos/headshot.jpg" alt="Dev Oberoi"><div><h1>${esc(p.first_name)} ${esc(p.last_name)}</h1><p class="lead">${esc(p.headline)}</p><p>${esc(p.current)} · ${esc(p.location)} · Available from ${esc(p.available_from)}</p>
    <div class="contact"><a class="btn btn-primary btn-sm" href="mailto:${esc(c.email)}"><span class="ms">mail</span>Email</a><a class="btn btn-out btn-sm" href="${esc(c.calendly)}" rel="noopener">Book a call</a><a class="btn btn-out btn-sm" href="${esc(c.linkedin)}" rel="noopener">LinkedIn</a></div></div></section>
  <p class="lead">${esc(P.pitch.short)}</p>
  <p><b style="font-weight:500">Looking for:</b> ${esc(p.looking_for)}.</p>
  <h2>Why hire him</h2><ul style="padding-left:18px;line-height:24px;color:var(--ink-2)">${P.pitch.why_hire.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
  <h2>Experience</h2>${P.experience.map(e => `<div class="job"><div class="when">${esc(e.dates)}</div><div><b>${esc(e.role)}</b>, ${esc(e.org)}, ${esc(e.place)}<ul>${e.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`).join('')}
  <h2>Projects</h2>${P.projects.map(pr => { const pg = P.project_pages[pr.slug] || {}; return `<article class="proj" id="${pr.slug}"><h3>${esc(pr.title)}</h3><div class="meta">${esc(pr.org)} · ${esc(pr.year)} · ${esc(pr.role)}</div><p>${esc(pr.summary)}</p><p class="res">${esc(pr.result)}</p>
    <details><summary>Full write-up</summary><p><b style="font-weight:500">Context.</b> ${esc(pg.context)}</p><p><b style="font-weight:500">Problem.</b> ${esc(pg.problem)}</p><ul>${(pg.what_i_did || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${(pg.decisions || []).map(d => `<p><b style="font-weight:500">${esc(d.choice)}.</b> ${esc(d.why)}</p>`).join('')}<p>${(pg.results || []).map(r => `${esc(r.metric)}: <b style="font-weight:500">${esc(r.value)}</b> (${esc(r.note)})`).join('. ')}.</p>${pg.learned ? `<p><b style="font-weight:500">Learned.</b> ${esc(pg.learned)}</p>` : ''}</details></article>`; }).join('')}
  <h2>Education</h2>${P.education.map(e => `<div class="job"><div class="when">${esc(e.years)}</div><div><b>${esc(e.degree)}</b>, ${esc(e.school)}<p style="margin:4px 0 0">${esc(e.notes)}</p></div></div>`).join('')}
  <h2>Skills</h2><div class="skills">${Object.entries(P.skills).map(([k, v]) => `<div><b>${esc(k)}</b><ul>${v.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
  <h2>Awards and certifications</h2><ul style="padding-left:18px;line-height:24px;color:var(--ink-2)">${P.wins.map(w => `<li><b style="font-weight:500">${esc(w.title)}</b>: ${esc(w.detail)}</li>`).join('')}${P.certifications.map(x => `<li>${esc(x.name)}, ${esc(x.issuer)}, ${esc(x.year)}</li>`).join('')}</ul>
  <h2>What people said</h2>${P.testimonials.map(t => `<p>"${esc(t.quote)}"<br><span style="font-size:13px;color:var(--mute)">${esc(t.name)}, ${esc(t.role)} (${esc(t.relation)})</span></p>`).join('')}
  <h2>Outside work</h2>${P.outside.map(o => `<p><b style="font-weight:500">${esc(o.title)}.</b> ${esc(o.detail)}</p>`).join('')}
  <p class="rv-foot">A portfolio by Dev Oberoi, built as a map app. Sample persona: the company, people, clients and numbers are invented.</p>`;
}).catch(() => { document.getElementById('rv').innerHTML = '<p>Could not load the résumé. Download the <a href="media/resume.pdf">PDF</a>.</p>'; });
</script>
</body>
</html>
