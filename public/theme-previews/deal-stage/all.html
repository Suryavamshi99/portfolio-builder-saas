<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Everything on one page · Harleen Bedi</title>
<meta name="description" content="Harleen Bedi's sales portfolio as one plain page: deals, record, journey, wins and contact.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f4ecdc' stroke='%23141210' stroke-width='5'/%3E%3Crect x='28' y='18' width='8' height='28' rx='4' fill='%23141210'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Big Shoulders";src:url(fonts/big-shoulders-display.woff2) format("woff2");font-weight:700 900}
@font-face{font-family:"Big Shoulders";src:url(fonts/big-shoulders-display-ext.woff2) format("woff2");font-weight:700 900;unicode-range:U+0100-02BA,U+20A0-20C4}
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-grotesque.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-grotesque-ext.woff2) format("woff2");font-weight:400 800;unicode-range:U+0100-02BA,U+20A0-20C4}
:root{--ink:#141210;--paper:#dcf4f4;--accent:#4ed17c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 Bricolage,system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:28px 22px 60px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:12px;font:800 14px/1 "Big Shoulders",sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:34px}
h1{font:900 clamp(48px,10vw,84px)/.9 "Big Shoulders",sans-serif;text-transform:uppercase;margin:0 0 12px}
h2{font:900 32px/1 "Big Shoulders",sans-serif;text-transform:uppercase;margin:46px 0 14px;padding-top:14px;border-top:4px solid var(--ink)}
h3{font:900 22px/1.05 "Big Shoulders",sans-serif;text-transform:uppercase;margin:22px 0 4px}
.meta{font-size:14.5px;font-weight:600;margin:0 0 6px}
ul{padding-left:20px}
.deal{display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.deal dt{font-weight:700}.deal dd{margin:0}
blockquote{margin:16px 0 4px;font-size:17.5px}
.note{font-size:13.5px;margin-top:40px}
</style>
</head>
<body>
<main id="r"><p>Loading…</p></main>
<script type="module">
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=await fetch('content/portfolio.json').then(r=>r.json()); const S=D.site, L=S.labels;
const P=Object.fromEntries(D.projects.map(p=>[p.slug,p]));
document.getElementById('r').innerHTML=`
<p class="top"><a href="index.html">Back to the site</a><a href="${e(D.contact.resume_pdf)}">Resume PDF</a></p>
<h1>${e(D.person.first_name)} ${e(D.person.last_name)}</h1>
<p><b>${e(D.person.headline)}.</b> ${e(D.pitch.short)}</p>
<p class="meta">${e(D.person.current)} · ${e(D.person.location)} · Free from ${e(D.person.available_from)}</p>
<p class="meta">Looking for: ${e(D.person.looking_for)}</p>
<p class="meta"><a href="mailto:${e(D.contact.email)}">${e(D.contact.email)}</a> · <a href="${e(D.contact.linkedin)}">LinkedIn</a> · <a href="${e(D.contact.calendly)}">Book a call</a></p>
<h2>Why hire me</h2><ul>${D.pitch.why_hire.map(x=>`<li>${e(x)}</li>`).join('')}</ul>
<h2>Deals and projects</h2>
${S.accounts.map(a=>{const p=P[a.slug],lb=L[a.kind];return `<h3><a href="project.html?p=${a.slug}">${e(p.title)}</a></h3><p class="meta">${e(p.org)} · ${e(p.year)} · ${e(p.role)}</p><dl class="deal"><dt>${e(lb[0])}</dt><dd>${e(a.size[0])} ${e(a.size[1])}</dd><dt>${e(lb[1])}</dt><dd>${e(a.cycle)}</dd></dl><p>${e(p.summary)} ${e(p.result)}.</p>`}).join('')}
<h2>Quota</h2><ul>${S.quota.years.map(y=>`<li>${e(y[0])}: ${y[1]}% (${e(y[2])})</li>`).join('')}<li>Against a ${e(S.quota.base)}</li></ul>
<h2>Experience</h2>${D.experience.map(x=>`<h3>${e(x.role)}, ${e(x.org)}</h3><p class="meta">${e(x.place)} · ${e(x.dates)}</p><ul>${x.points.map(p=>`<li>${e(p)}</li>`).join('')}</ul>`).join('')}
<h2>Education</h2>${D.education.map(x=>`<h3>${e(x.degree)}</h3><p class="meta">${e(x.school)} · ${e(x.years)}</p><p>${e(x.notes)}</p>`).join('')}
<h2>Journey</h2><ul>${D.journey.map(j=>`<li><b>${e(j.year)}</b> ${e(j.title)}. ${e(j.detail)}</li>`).join('')}</ul>
<h2>Wins</h2><ul>${D.wins.map(w=>`<li><b>${e(w.title)}.</b> ${e(w.detail)}</li>`).join('')}</ul>
<h2>What people say</h2>${D.testimonials.map(t=>`<blockquote>“${e(t.quote)}”</blockquote><p class="meta">${e(t.name)}, ${e(t.role)}. ${e(t.relation)}.</p>`).join('')}
<h2>Skills and certifications</h2>${Object.entries(D.skills).map(([k,v])=>`<p><b>${e(k)}:</b> ${v.map(e).join(', ')}</p>`).join('')}<ul>${D.certifications.map(c=>`<li>${e(c.name)}, ${e(c.issuer)}, ${e(c.year)}</li>`).join('')}</ul>
<h2>Outside work</h2><ul>${D.outside.map(o=>`<li><b>${e(o.title)}.</b> ${e(o.detail)}</li>`).join('')}</ul>
<h2>About</h2><p>${e(D.about.intro)}</p><p>${e(D.about.now)}</p>
${D.demo?`<p class="note">${e(D._note)}</p>`:''}`;
</script>
</body>
</html>
